# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit review configuration for HX-Eco-System.
#
# Every path instruction below encodes a rule this repository already states in
# prose. The point is that a reviewer enforces them on every change, instead of
# them holding only as long as someone remembers.

language: en-GB
tone_instructions: >-
  Be direct and specific. Say what is wrong and what to do instead. Skip praise
  and skip restating the diff. Prefer one concrete finding over three vague ones.

reviews:
  # The owner's standing instruction is no trash in the repository.
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  changed_files_summary: true
  estimate_code_review_effort: true
  collapse_walkthrough: true
  poem: false
  sequence_diagrams: false

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    # This list is branches *other than* the default, so naming main here added
    # nothing and excluded everything else. A pull request stacked on another
    # branch was skipped with "auto reviews are disabled on base/target
    # branches other than the default branch" - an unreviewed change, which is
    # the one outcome this repository does not accept.
    #
    # The decision is made from the pull request's base branch, so this has to
    # reach main to take effect; fixing it only on a stacked branch cannot
    # rescue that branch's own review.
    base_branches:
      - ".*"

  # Finishing touches. Both are already CodeRabbit defaults; they are written
  # here so the setting is visible in the repository instead of inherited
  # silently, and so turning one off has to be a recorded decision.
  #
  # autofix: the checkbox under a review comment, and `@coderabbitai autofix`.
  # fix_ci:  `@coderabbitai fix-ci`, for CI failures attributed to the pull
  #          request. This one requires a CodeRabbit Team plan; on the free
  #          OSS tier the command is offered but will not deliver a fix.
  finishing_touches:
    autofix:
      enabled: true
    fix_ci:
      enabled: true

  path_filters:
    # Generated output. Reviewing it wastes the file budget and any finding
    # belongs in the Markdown source or the generator, never here.
    - "!human-html/**"
    # Superseded history. Never current authority; changing it is not a fix.
    - "!archive/**"
    # Generated from docs/00-control/hx-fleet.tsv.
    - "!docs/03-runbooks/common/hx-fleet-ips.env"
    # CodeRabbit's own default filters exclude **/*.tsv, which silently kept
    # both source-of-truth files out of every review. The fleet table and the
    # proof chain are generated from these two files, and hx-smoke-promote
    # gates a PASS on the second one. They are the last files in the
    # repository that should go unreviewed, so re-include them by name.
    - "docs/00-control/hx-fleet.tsv"
    - "docs/00-control/hx-proof.tsv"

  path_instructions:
    - path: "docs/03-runbooks/**/*.sh"
      instructions: >-
        Execution artifacts that run as root on production servers. Require:
        `set -euo pipefail`; a host guard via `hx_require_host` before anything
        else; quoted variable expansions; and no hard-coded host, IP, or version
        that belongs in `common/hx-base.env`. Application software must come
        from PyPI, npm, a GitHub release, an upstream source tarball, a direct
        binary, or Hugging Face. Flag any apt install of application software;
        the Ubuntu archive is permitted only for the NVIDIA driver and for build
        toolchains and library headers. Snap is never permitted. Flag any
        Docker, Podman, or Kubernetes usage. Downloads of a tarball or binary
        must verify a checksum. Validation is deliberately minimal: the service
        starts and survives a reboot; do not ask for more.

    - path: "tools/**"
      instructions: >-
        Repository tooling. Python 3 standard library only; flag any new
        third-party import. These enforce written rules, so a check that cannot
        fail is a defect. Flag silently swallowed errors, and any comparison
        that could report drift against the wrong thing. Shell wrappers must
        resolve a working Python 3 rather than assuming `python3` is an
        interpreter.

    - path: "human-html/**"
      instructions: >-
        Generated by `tools/hx-doc/hx-render-html`. If a change appears here
        without the matching Markdown source changing, that is the finding.

    - path: "docs/00-control/**"
      instructions: >-
        Control documents. Active documents use stable filenames with no version
        or date in the name; version, date and status live inside the document.
        A superseded version belongs under `archive/YYYY-MM-DD/`. Flag any claim
        of as-built state that is not backed by evidence, and any decision
        recorded as ratified without an owner deciding it.

    - path: "docs/02-server-records/*.md"
      instructions: >-
        As-built records. Model and application provenance requires both a
        source URI and a full SHA-256; a hash alone does not establish origin,
        and an origin alone does not establish what is running. An unknown value
        is recorded as `UNRESOLVED`, never omitted. Flag a PASS or CLOSED state
        that is not supported by the recorded gates.

    - path: "smoke-tests/*.md"
      instructions: >-
        Component acceptance authorities. Each needs a known answer, a cleanup
        step, and evidence retention. Service health alone is never sufficient.
        These must not redefine ecosystem placement, server roles, permanent
        integration, or network architecture.

    - path: "skills/**"
      instructions: >-
        Governed agent expertise, subordinate to HX architecture, runbooks and
        smoke-test authority. Registry lifecycle states must be ones
        `SKILL-GOVERNANCE.md` defines. Every approved skill needs a reviewed
        upstream commit and a last-reviewed date. Skills never contain
        credentials of any kind, including sshpass passwords.

    - path: ".github/workflows/*.yml"
      instructions: >-
        Flag unpinned third-party actions, secrets echoed into logs, and any
        check that cannot fail. A workflow that always passes is worse than no
        workflow, because it looks like coverage.

  tools:
    shellcheck:
      enabled: true
    ruff:
      enabled: true
    markdownlint:
      enabled: true
    yamllint:
      enabled: true
    actionlint:
      enabled: true
    gitleaks:
      enabled: true
    github-checks:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: local
