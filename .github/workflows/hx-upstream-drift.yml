name: Version and pin currency

# skills/SKILL-REGISTRY.md pins the exact upstream commit each governed skill
# was reviewed at. Those pins were maintained entirely by memory. This reports
# when an upstream has moved so the owner can decide whether to re-review.

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    name: Compare pins to upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # checkout writes GITHUB_TOKEN into .git/config by default, and
          # these jobs then run repository-controlled scripts. Nothing here
          # needs authenticated git.
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Pinned artifacts are still fetchable
        run: ./tools/hx-doc/hx-preflight --quiet

      - name: Check pins
        id: drift
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Pinned upstream commits"
            echo
            ./tools/hx-doc/hx-upstream-drift --markdown
            echo
            echo "## Product version pins"
            echo
            ./tools/hx-doc/hx-version-pins --markdown
          } > drift.md
          drifted=false
          ./tools/hx-doc/hx-upstream-drift --fail-on-drift   >/dev/null || drifted=true
          ./tools/hx-doc/hx-version-pins  --fail-on-outdated >/dev/null || drifted=true
          echo "drifted=$drifted" >> "$GITHUB_OUTPUT"
          cat drift.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the drift issue
        if: steps.drift.outputs.drifted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Version pins have drifted"
          body="$(cat drift.md)

          Re-review each drifted source, then update its reviewed commit and
          \`Last reviewed\` date in \`skills/SKILL-REGISTRY.md\`.

          Drift is information, not a failure. A pin stays valid until the
          owner decides to move it."
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label upstream-drift || \
            gh issue create --title "$title" --body "$body"
          fi
